name: Test and publish Sibyl.ad prerelease

on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sibyl-ad-release
  cancel-in-progress: false

jobs:
  prerelease:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test add-on
        run: bash scripts/build-release.sh
      - name: Verify version and release archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          meta=json.loads(pathlib.Path("module.json").read_text())
          assert meta["id"]=="Sibyl.ad"
          assert meta["version"]=="0.1.0-rc.1"
          assert pathlib.Path("dist/Sibyl.ad-v0.1.0-rc.1.zip").is_file()
          print("Version matches prerelease manifest")
          PY
          (cd dist && sha256sum -c Sibyl.ad-v0.1.0-rc.1.zip.sha256)
      - name: Publish one immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="v0.1.0-rc.1"
          if gh release view "$version" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Prerelease $version already exists; refusing overwrite"
            exit 0
          fi
          gh release create "$version" \
            "dist/Sibyl.ad-v0.1.0-rc.1.zip" \
            "dist/Sibyl.ad-v0.1.0-rc.1.zip.sha256" \
            --repo "$REPOSITORY" \
            --target "$SHA" \
            --title "Sibyl.ad $version – Read-only LDAPS Connector" \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            --verify-tag
